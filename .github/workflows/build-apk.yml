name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unpack project
        run: |
          mkdir -p buildsrc
          unzip -q line_gpt_phone_only_implemented-1.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc/line_gpt_phone_only
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: line-gpt-phone-apk
          path: buildsrc/line_gpt_phone_only/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
