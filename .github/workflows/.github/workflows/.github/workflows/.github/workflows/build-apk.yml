name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q line_gpt_phone_only_implemented-1.zip -d buildsrc
          find buildsrc -maxdepth 3 -type f | sort | head -100

      - name: Build debug APK
        working-directory: buildsrc/line_gpt_phone_only
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: line-gpt-phone-apk
          path: buildsrc/line_gpt_phone_only/app/build/outputs/apk/debug/app-debug.apk
